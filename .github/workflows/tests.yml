name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: squadcrm
          POSTGRES_USER: squadcrm
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squadcrm -d squadcrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: squadcrm
      POSTGRES_USER: squadcrm
      POSTGRES_PASSWORD: test-only-password
      Authentication__SigningKey: squadcrm-ci-only-signing-key-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/backend/SquadCrm.sln
      - run: dotnet format src/backend/SquadCrm.sln --no-restore --verify-no-changes
      - run: dotnet build src/backend/SquadCrm.sln --no-restore
      - run: dotnet test src/backend/SquadCrm.sln --no-restore --no-build
      - run: dotnet tool restore
        working-directory: src/backend
      - name: Validate ArchitectureFixture migrations
        working-directory: src/backend
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/ArchitectureFixture/SquadCrm.Modules.ArchitectureFixture
          --startup-project src/Modules/ArchitectureFixture/SquadCrm.Modules.ArchitectureFixture
          --context ArchitectureFixtureDbContext
      - name: Validate StaffIdentity migrations
        working-directory: src/backend
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/StaffIdentity/SquadCrm.Modules.StaffIdentity
          --startup-project src/Modules/StaffIdentity/SquadCrm.Modules.StaffIdentity
          --context StaffIdentityDbContext

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --prefix src/frontend
      - run: npm run format:check --prefix src/frontend
      - run: npm run lint --prefix src/frontend
      - run: npm run build --prefix src/frontend
      - run: npm test --prefix src/frontend -- --no-progress
