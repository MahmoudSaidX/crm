<sc-app-layout
  [title]="shellTitle()"
  [logoUrl]="branding.value().compactLogoUrl"
  [menuLabel]="localization.translate('common.navigation.openMenu')"
  [closeMenuLabel]="localization.translate('common.navigation.closeMenu')"
  [actionsLabel]="localization.translate('common.navigation.moreActions')"
  [darkModeLabel]="localization.translate('common.theme.toggle')"
  [navigationLabel]="localization.translate('common.navigation.primary')"
  [navigationItems]="navigationItems()"
  [footerText]="shellTitle()"
>
  <portal-language-switcher shell-actions />
</sc-app-layout>
