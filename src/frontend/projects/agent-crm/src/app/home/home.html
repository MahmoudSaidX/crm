<main class="home">
  <h1>Squad CRM — Agent</h1>
  <p data-testid="surface">{{ config.appSurface }}</p>
  <p data-testid="direction">{{ locale() }} / {{ direction() }}</p>

  <p-button
    icon="pi pi-globe"
    [label]="locale() === 'en' ? 'العربية' : 'English'"
    data-testid="locale-toggle"
    (onClick)="toggleLocale()"
  />
  <p-button
    icon="pi pi-sign-out"
    label="Sign out"
    severity="secondary"
    data-testid="sign-out"
    (onClick)="signOut()"
  />
</main>
