<main class="roles-page">
  <header class="roles-header">
    <h1>Roles</h1>
    <p-button label="New role" icon="pi pi-plus" routerLink="/roles/new" />
  </header>

  <p-table
    [value]="roles()"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (onLazyLoad)="onLazyLoad($event)"
    dataKey="id"
  >
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Code</th>
        <th>Description</th>
        <th>Status</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-role>
      <tr>
        <td>{{ role.name }}</td>
        <td>{{ role.code }}</td>
        <td>{{ role.description || '—' }}</td>
        <td>
          <p-tag
            [value]="role.isActive ? 'Active' : 'Inactive'"
            [severity]="role.isActive ? 'success' : 'danger'"
          />
        </td>
        <td class="row-actions">
          <p-button
            label="Edit"
            icon="pi pi-pencil"
            severity="secondary"
            size="small"
            [routerLink]="['/roles', role.id, 'edit']"
          />
          <p-button
            [label]="role.isActive ? 'Deactivate' : 'Activate'"
            [icon]="role.isActive ? 'pi pi-ban' : 'pi pi-check'"
            [severity]="role.isActive ? 'danger' : 'success'"
            size="small"
            (onClick)="toggleActive(role)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No roles yet.</td>
      </tr>
    </ng-template>
  </p-table>
</main>
