<main class="staff-roles-page">
  <header>
    <h1>{{ localization.translate('staffUsers.roles.title') }}</h1>
    @if (staffUser(); as currentStaffUser) {
      <p>{{ currentStaffUser.displayName || currentStaffUser.email }}</p>
    }
  </header>

  @if (error()) {
    <p-message severity="error" [text]="localization.translate('staffUsers.roles.error')" />
  }

  <section class="role-group">
    @for (role of roles(); track role.id) {
      <label class="role-item" [for]="role.id">
        <p-checkbox
          [inputId]="role.id"
          [binary]="true"
          [ngModel]="selected().has(role.id)"
          (ngModelChange)="toggle(role.id, $event)"
        />
        <span>
          <strong>{{ role.name }}</strong>
          <code>{{ role.code }}</code>
        </span>
      </label>
    }
  </section>

  <div class="actions">
    <p-button
      [label]="localization.translate('staffUsers.roles.save')"
      icon="pi pi-save"
      [loading]="saving()"
      (onClick)="save()"
    />
  </div>
</main>
