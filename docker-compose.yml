# Squad CRM — local development infrastructure (CRM-197) and full local
# application stack (CRM-205).
#
# `postgres` provides the database only; EF Core, schemas, migrations and
# application persistence are owned by the modules, Hangfire storage is
# wired by the backend itself, and observability is owned by CRM-201.
# `backend`, `agent-crm` and `customer-portal` (CRM-205) build and run the
# ASP.NET Core API and both Angular apps from source for local development
# and demos — `docker compose up --build` starts the complete stack.
#
# Values are substituted from `env/backend.env` (git-ignored):
#   export COMPOSE_ENV_FILES=env/backend.env   # or: --env-file env/backend.env
# Every `postgres` variable has a developer-safe default, so plain
# `docker compose up -d postgres` still works on a fresh clone. `backend`
# additionally loads every value from `env/backend.env` directly (see its
# `env_file:` below), so that file must exist before `docker compose up
# --build` is run — `cp env/backend.env.example env/backend.env` first.
# Never put a production credential here.

name: ${COMPOSE_PROJECT_NAME:-squadcrm}

services:
  postgres:
    # Concrete, non-floating tag verified with `docker pull` (CRM-197 Task 1).
    # Never a floating tag, never derived from PG_VERSION.
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-squadcrm}
      POSTGRES_USER: ${POSTGRES_USER:-squadcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Loopback-only: reachable from host-run apps, not from the local network.
      # The container always listens on 5432; POSTGRES_PORT only moves the host port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images require a single mount at /var/lib/postgresql;
      # the server places its data in a major-version subdirectory below it.
      # See https://github.com/docker-library/postgres/pull/1259
      - squadcrm-pgdata:/var/lib/postgresql
    healthcheck:
      # `$${...}` is intentional: the doubled `$` escapes Compose substitution so
      # the variables expand inside the container from `environment:` above.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    env_file:
      - env/backend.env
    environment:
      # Docker-network overrides: env/backend.env keeps POSTGRES_HOST=localhost
      # for host-run `dotnet run`; these two values win here via `environment:`
      # taking precedence over `env_file:`.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ASPNETCORE_URLS: http://+:8080
    ports:
      # Same host port `dotnet run` already publishes, so both Angular apps'
      # committed config.json (apiBaseUrl) needs no change.
      - "127.0.0.1:${BACKEND_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent-crm:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        APP_PROJECT: agent-crm
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_started

  customer-portal:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        APP_PROJECT: customer-portal
    ports:
      - "127.0.0.1:4300:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  squadcrm-pgdata:
    name: ${POSTGRES_VOLUME_NAME:-squadcrm-pgdata}
