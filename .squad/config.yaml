version: 1
project:
  name: crm
  primaryLanguage: typescript
  projectRoots:
    - .
tracker:
  type: none
naming:
  includeTrackerId: true
  globalSequence: true
agents: []
planner:
  enabled: true
  provider: anthropic
  mode: auto
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
  auth:
    anthropic: subscription
